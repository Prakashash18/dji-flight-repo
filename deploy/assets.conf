# Where fetch-assets.sh pulls the big files from on a fresh pod.
#
# Edit the two URLs below, commit this file, and a cold start needs nothing but
# the repo. Anything already present on disk is skipped, so re-running is safe.

# Detection weights (19 MB). Already installed via model_source, which handles
# Drive's confirm-token dance for you.
MODEL_URL="https://drive.google.com/file/d/1Gt03JXACbwrqbo5-uAmdATY6zgUmIhv9/view?usp=sharing"
MODEL_NAME="beach_litter.pt"

# Sample flight footage (486 MB) — only needed for the "Run this sample" button.
# Set SAMPLE_URL="" to skip it and upload a video by hand instead; the pod will
# start fine either way, the sample button just won't work.
#
# Drive throttles large files and can hand back an HTML quota page instead of the
# video. If that bites you, put the .mp4 in the Supabase bucket you already pay
# for and use its public URL here — plain HTTP, no confirm token, no quota.
SAMPLE_URL="https://drive.google.com/uc?export=download&id=1-PPOzaSL3AcZNmBarK6Rcs0WOKVDoNVW"
SAMPLE_SRT_URL=""   # optional; the .srt is only 360KB and is already in the repo
